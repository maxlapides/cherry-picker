name: Cherry-Picker Bot
description: "Cherry-pick a PR to all requested branches"
branding:
  icon: move
  color: green

inputs:
  token:
    description: "GitHub bot token, used for creating PRs"
    required: true
  gh_token:
    description: "GitHub token, used for auto-approving PRs when auto-approval is enabled"
    required: false
  pr_number:
    description: "PR number to cherry-pick"
    required: true
  auto_approve_and_merge:
    description: "Whether to automatically approve and enable auto-merge for cherry-pick PRs"
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Reconcile cherry-pick requests
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        APPROVAL_TOKEN: ${{ inputs.gh_token }}
        PR_NUMBER: ${{ inputs.pr_number }}
        AUTO_APPROVE_AND_MERGE: ${{ inputs.auto_approve_and_merge }}
        ACTION_PATH: ${{ github.action_path }}
      run: node "$ACTION_PATH/scripts/cherry_pick.js"
